<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./images/images-dinner.jpg" type="image/x-icon">
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/index-style-response.css">
    <link rel="stylesheet" href="./css/index-style.css">
    <title>What Is For Dinner</title>
</head>
<body>
    
    <nav class="navbar navbar-expand-lg bg-white p-3 border-bottom">
        <div class="container">

            <!-- Logo -->
            <div class="d-flex align-items-center">
            <i class="fa-solid fa-utensils linear-orange p-2 fs-5 text-light rounded-circle"></i>
            <div class="ms-2">
                <p class="text-dark fw-bold mb-0">What's For Dinner</p>
                <small class="color-light-gray">Your daily meal inspiration</small>
            </div>
            </div>

            <!-- Toggle -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu -->
            <div id="navbarSupportedContent" class="collapse navbar-collapse justify-content-end">

            <div class="d-flex align-items-center flex-column flex-lg-row w-100 w-lg-auto">

                <div class="nav-item-custom">
                    <i class="fa-solid fa-bookmark me-2"></i>
                    <span>Saved Recipe</span>
                </div>

                <div class="nav-item-custom">
                    <i class="fa-solid fa-clock-rotate-left me-2"></i>
                    <span>Recent</span>
                </div>

                <div class="nav-item-custom">
                    <i class="fa-solid fa-gear me-2"></i>
                    <span>Settings</span>
                </div>

                <div class="nav-item-custom d-flex align-items-center">
                    <img src="./images/avatar-4.jpg" class="avatar me-2" alt="">
                    <span>Profile</span>
                </div>

            </div>

            </div>
        </div>
    </nav>


    <section class="container pt-5  mb-5">
        <div class="row bg-light main-section overflow-y-auto ">
            <div id="left-part-image" class="left-part d-flex flex-column justify-content-between col-12 col-lg-4">

    <!-- Rating -->
    <div class="star-icone rounded-pill d-flex bg-light w-fit-content p-2 p-lg-3 m-2 m-lg-3">
        <i class="fa-solid fa-star star-color pe-2 pe-lg-3"></i>
        <p id="rat-number" class="fw-bold pe-2 pe-lg-3 mb-0">4.6</p>
        <p id="review-number" class="color-light-gray pe-2 pe-lg-3 mb-0"></p>
    </div>

    <!-- Bottom Icons -->
    <div class="bottom-icons d-flex align-items-center justify-content-between bg-light w-100 p-3 p-lg-4 rounded-3 mx-auto mb-3 mb-lg-5 flex-wrap">

        <div class="icon-box">
            <i class="fa-solid fa-clock light-orange-color fs-4 fs-lg-3"></i>
            <p class="color-light-gray mt-2 mb-1">Prep Time</p>
            <p id="preparation-time" class="fw-bold mb-0"></p>
        </div>

        <div class="icon-box">
            <i class="fa-solid fa-dumpster-fire light-orange-color fs-4 fs-lg-3"></i>
            <p class="color-light-gray mt-2 mb-1">Cook Time</p>
            <p id="cooking-time" class="fw-bold mb-0"></p>
        </div>

        <div class="icon-box">
            <i class="fa-solid fa-people-group light-blue fs-4 fs-lg-3"></i>
            <p class="color-light-gray mt-2 mb-1">Serving</p>
            <p id="saving-people" class="fw-bold mb-0"></p>
        </div>

    </div>
            </div>


            <div id="right-part" class="col-sm-100 col-lg-8 p-5 main-section-hight overflow-y-auto">

                <div class="title d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center gap-3">

        <div class="left-part-desc">

            <div class="d-flex flex-wrap">
                <p id="level" class="light-green-color heavy-green-color text-capitalize p-3 rounded-pill fw-bold w-fit-content"></p>
                <p id="country" class="heavy-blue bg-blue-color text-capitalize p-3 ms-0 ms-lg-4 mt-2 mt-lg-0 rounded-pill fw-bold w-fit-content"></p>
            </div>

            <p id="food-name" class="fw-bold fs-1 py-3 mb-0"></p>
            <p id="food-desc" class="color-heavy-gray fs-4 lh-24"></p>

        </div>

        <div class="right-part d-flex flex-row flex-lg-column">

            <i class="fa-solid fa-bookmark heavy-orange-color bg-orange-color fs-5 p-3 m-2 rounded-2 cursor-pointer"></i>
            <i class="fa-solid fa-share-nodes heavy-orange-color bg-orange-color fs-5 p-3 m-2 rounded-2 cursor-pointer"></i>

        </div>

                </div>


                <div id="alert" class="alert align-items-center my-3 d-none flex-column flex-md-row">
        <i class="fa-solid fa-triangle-exclamation light-red fs-3 pe-0 pe-md-3 mb-2 mb-md-0"></i>
        <div>
            <p class="heavy-red fw-bold mb-1">Extended Preparation Time</p>
            <p class="light-red lh-24 mb-0">
                This recipe requires more than 45 minutes to prepare. Plan accordingly!
            </p>
        </div>
                </div>

    
                <ul class="nav nav-pills mb-3 flex-wrap justify-content-between border-bottom">
            
                <li class="nav-item" role="presentation">
            <button class="nav-link active color-heavy-gray fw-bold"
                    id="pills-home-tab"
                    data-bs-toggle="pill"
                    data-bs-target="#pills-home">
                <i class="fa-solid fa-list-check"></i> Ingrediant
            </button>
                </li>
            
                <li class="nav-item" role="presentation">
                    <button class="nav-link color-heavy-gray fw-bold"
                            id="pills-profile-tab"
                            data-bs-toggle="pill"
                            data-bs-target="#pills-profile">
                        <i class="fa-solid fa-book-open"></i> Instructions
                    </button>
                </li>
            
                <li class="nav-item" role="presentation">
                    <button class="nav-link color-heavy-gray fw-bold"
                            id="pills-contact-tab"
                            data-bs-toggle="pill"
                            data-bs-target="#pills-contact">
                        <i class="fa-brands fa-nutritionix"></i> Nutrition
                    </button>
                </li>
            
                <li class="nav-item" role="presentation">
                    <button class="nav-link color-heavy-gray fw-bold"
                            id="pills-chef-tab"
                            data-bs-toggle="pill"
                            data-bs-target="#pills-chef">
                        <i class="fa-solid fa-lightbulb"></i> Chef's Tips
                    </button>
                </li>
            
                </ul>
            
                <div class="hight-section overflow-y-auto border-bottom">
            
                <div class="tab-content" id="pills-tabContent">
                
                    <div class="tab-pane fade show active bg-ingrediant-color py-3 rounded-4"
                        id="pills-home">
                    </div>
                
                    <div class="tab-pane fade" id="pills-profile"></div>
                
                    <div class="tab-pane fade" id="pills-contact">
                    
                        <div class="container-fluid">
                            <div class="row g-3">
                            
                                <div class="col-12 col-md-6">
                                
                                    <div class="d-flex justify-content-between align-items-center bg-nutrition p-3 rounded-4 mb-3">
                                        <div class="d-flex align-items-center">
                                            <i class="fa-solid fa-fire heavy-orange-color bg-orange-color p-3 rounded-3 fs-4"></i>
                                            <p class="fs-5 color-heavy-gray ms-2 pt-3">Calories</p>
                                        </div>
                                        <p id="calories" class="fw-bold fs-4"></p>
                                    </div>
                                
                                    <div class="d-flex justify-content-between align-items-center bg-nutrition p-3 rounded-4 mb-3">
                                        <div class="d-flex align-items-center">
                                            <i class="fa-solid fa-wheat-awn p-3 rounded-3 fs-4"></i>
                                            <p class="fs-5 color-heavy-gray ms-2 pt-3">Carbohydrates</p>
                                        </div>
                                        <p id="carbohydrates" class="fw-bold fs-4"></p>
                                    </div>
                                
                                    <div class="d-flex justify-content-between align-items-center bg-nutrition p-3 rounded-4 mb-3">
                                        <div class="d-flex align-items-center">
                                            <i class="fa-brands fa-pagelines p-3 rounded-3 fs-4"></i>
                                            <p class="fs-5 color-heavy-gray ms-2 pt-3">Fiber</p>
                                        </div>
                                        <p id="fiber" class="fw-bold fs-4"></p>
                                    </div>
                                
                                </div>
                            
                                <div class="col-12 col-md-6">
                                
                                    <div class="d-flex justify-content-between align-items-center bg-nutrition p-3 rounded-4 mb-3">
                                        <div class="d-flex align-items-center">
                                            <i class="fa-solid fa-dumbbell bg-orange-color p-3 rounded-3 fs-4"></i>
                                            <p class="fs-5 color-heavy-gray ms-2 pt-3">Protein</p>
                                        </div>
                                        <p id="protein" class="fw-bold fs-4"></p>
                                    </div>
                                
                                    <div class="d-flex justify-content-between align-items-center bg-nutrition p-3 rounded-4 mb-3">
                                        <div class="d-flex align-items-center">
                                            <i class="fa-solid fa-droplet p-3 rounded-3 fs-4"></i>
                                            <p class="fs-5 color-heavy-gray ms-2 pt-3">Fat</p>
                                        </div>
                                        <p id="fat" class="fw-bold fs-4"></p>
                                    </div>
                                
                                    <div class="d-flex justify-content-between align-items-center bg-nutrition p-3 rounded-4 mb-3">
                                        <div class="d-flex align-items-center">
                                            <i class="fa-solid fa-cube p-3 rounded-3 fs-4"></i>
                                            <p class="fs-5 color-heavy-gray ms-2 pt-3">Sodium</p>
                                        </div>
                                        <p id="sodium" class="fw-bold fs-4"></p>
                                    </div>
                                
                                </div>
                            
                            </div>
                        </div>
                    
                    </div>
                
                    <div class="tab-pane fade" id="pills-chef">
                    
                        <div id="chef-tip" class=" rounded-3 p-2 d-flex flex-column  mb-4">
                        </div>
                    
                    </div>
                
                </div>
            
                </div>

                <button onclick="randomeMeal()"
                        class="p-3 rounded-3 border-0 text-light btn-bg-color fw-bold mt-4 w-100 w-lg-auto">
                    <i class="fa-solid fa-arrows-rotate"></i> Try Another Recipe

                </button>
            </div>


        </div>
    </section>

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/index.js"></script>
</body>
</html>
