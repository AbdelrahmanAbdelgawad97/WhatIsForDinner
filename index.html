<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./images/images-dinner.jpg" type="image/x-icon">
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/index-style-response.css">
    <link rel="stylesheet" href="./css/index-style.css">
    <title>What Is For Dinner</title>
</head>
<body>
    
    <nav class="navbar navbar-expand-lg bg-white p-3 border-bottom">

        <div class="container-fluid container-lg">
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-utensils linear-orange p-3 fs-4 text-light rounded-circle"></i>
                <div class="ms-3 transforme-top-50 position-relative">
                    <p class="text-dark fw-bold fs-4">What's For Dinner</p>
                    <p class="color-light-gray pt-2">Your daily meal inspiration</p>
                </div>
            </div>

            <button class="navbar-toggler " type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>


            <div id="navbarSupportedContent" class="collapse navbar-collapse w-25">

                <div class=" d-flex align-items-center flex-sm-column flex-lg-row" role="search">
                    <div class="color-heavy-gray cursor-pointer hover-orange fs-5 me-3 mt-sm-4 mt-lg-0 d-flex me-auto align-items-center"><i class="fa-solid  fa-bookmark  me-3"></i><span class="d-sm-inline d-lg-none"> Saved Recipe</span></div>
                    <div class="color-heavy-gray cursor-pointer hover-orange fs-5 me-3 mt-sm-4 mt-lg-0 d-flex me-auto align-items-center"><i class="fa-solid fa-clock-rotate-left me-3"></i><span class="d-sm-inline d-lg-none"> Recent</span></div>
                    <div class="color-heavy-gray cursor-pointer hover-orange fs-5 me-3 mt-sm-4 mt-lg-0 d-flex me-auto align-items-center"><i class="fa-solid fa-gear  me-3"></i><span class="d-sm-inline d-lg-none"> Settings</span></div>
                    <div class="cursor-pointer color-heavy-gray d-flex align-items-center "><img src="./images/avatar-4.jpg" class="w-15 rounded-circle border-color-light-orange mt-sm-4 mt-lg-0 me-3" alt=""><span class=" hover-orange d-sm-inline d-lg-none"> Profile</span></div>
                </div>

            </div>
        </div>
    </nav>

    <section class="container pt-5  mb-5">
        <div class="row bg-light main-section overflow-y-auto ">
            <div id="left-part-image" class="left-part d-flex flex-column justify-content-between col-sm-100 col-lg-4 main-section-hight">
    
                <div class="star-icone rounded-pill d-flex bg-light w-fit-content p-3 m-3">
                    <i class="fa-solid fa-star star-color pe-3"></i>
                    <p id="rat-number" class="fw-bold pe-3">4.6</p>
                    <p id="review-number" class="color-light-gray pe-3"></p>
                </div>
    
                <div class="bottom-icons d-flex align-items-center justify-content-center bg-light w-sm-100 w-fit-content p-4 rounded-3 mx-auto mb-5">
                    <div class="d-flex flex-column align-items-center">
                        <i class="fa-solid fa-clock light-orange-color fs-3"></i>
                        <p class="color-light-gray pt-3 lh-16">Prep Time</p>
                        <p id="preparation-time" class="fw-bold pt-3 lh-16"></p>
                    </div>
    
                    <div class="d-flex flex-column align-items-center px-5">
                        <i class="fa-solid fa-dumpster-fire light-red light-orange-color fs-3"></i>
                        <p class="color-light-gray pt-3 lh-16">Cook Time</p>
                        <p id="cooking-time" class="fw-bold pt-3 lh-16"></p>
                    </div>
    
                    <div class="d-flex flex-column align-items-center">
                        <i class="fa-solid fa-people-group light-blue fs-3"></i>
                        <p class="color-light-gray pt-3 lh-12">Saving</p>
                        <p id="saving-people" class="fw-bold pt-3 lh-12"></p>
                    </div>
    
                </div>
            </div>

            <div id="right-part" class="col-sm-100 col-lg-8 p-5 main-section-hight overflow-y-auto">
                <div class="title d-flex justify-content-between align-items-center ">
                    <div class="left-part-desc">
                        <div class="d-flex">
                            <p id="level" class="light-green-color heavy-green-color text-capitalize p-3 rounded-pill fw-bold w-fit-content"></p>
                            <p id="country" class="heavy-blue bg-blue-color text-capitalize p-3 ms-4 rounded-pill fw-bold w-fit-content"></p>
                        </div>
                        <p id="food-name" class="fw-bold fs-1 py-4"></p>
                        <p id="food-desc" class="color-heavy-gray fs-4 lh-24"></p>
                    </div>

                    <div class="right-part d-flex">
                        <i class="fa-solid fa-bookmark heavy-orange-color bg-orange-color fs-5 p-3 m-2 heavy-orange-color rounded-2 cursor-pointer"></i>
                        <i class="fa-solid fa-share-nodes heavy-orange-color bg-orange-color fs-5 p-3 m-2 heavy-orange-color rounded-2 cursor-pointer"></i>
                    </div>
                </div>

                <div id="alert" class="alert align-items-center my-3 d-none">
                    <i class="fa-solid fa-triangle-exclamation light-red fs-3 pe-3"></i>
                    <div>
                        <p class="heavy-red fw-bold">Extended Preparation Time</p>
                        <p class="light-red lh-24">This recipe requires more than 45 minutes to prepare. Plan accordingly!</p>
                    </div>
                </div>

                <ul class="nav nav-pills mb-3 d-flex justify-content-around border-bottom" id="pills-tab" role="tablist">
                  <li class="nav-item " role="presentation">
                    <button class="nav-link active color-heavy-gray color-heavy-gray fw-bold" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home" type="button" role="tab" aria-controls="pills-home" aria-selected="true"><i class="fa-solid fa-list-check"></i> Ingrediant</button>
                  </li>
                  <li class="nav-item" role="presentation">
                    <button class="nav-link color-heavy-gray fw-bold" id="pills-profile-tab" data-bs-toggle="pill" data-bs-target="#pills-profile" type="button" role="tab" aria-controls="pills-profile" aria-selected="false"><i class="fa-solid fa-book-open"></i> Instructions</button>
                  </li>
                  <li class="nav-item" role="presentation">
                    <button class="nav-link color-heavy-gray fw-bold" id="pills-contact-tab" data-bs-toggle="pill" data-bs-target="#pills-contact" type="button" role="tab" aria-controls="pills-contact" aria-selected="false"><i class="fa-brands fa-nutritionix"></i> Nutrition</button>
                  </li>
                  <li class="nav-item" role="presentation">
                    <button class="nav-link color-heavy-gray fw-bold" id="pills-chef-tab" data-bs-toggle="pill" data-bs-target="#pills-chef" type="button" role="tab" aria-controls="pills-chef" aria-selected="false"><i class="fa-solid fa-lightbulb"></i> Chef's Tips</button>
                  </li>
                </ul>

                <div class="hight-section overflow-y-auto border-bottom">
                    <div class="tab-content" id="pills-tabContent">
                      <div class="tab-pane fade show active bg-ingrediant-color py-3 rounded-4" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab" tabindex="0">

                        <!-- <div id="steps-recipt" class="steps-recipt d-flex align-items-center">
                            <p class="number-ingrediant">1</p>
                            <p class="descript">1 ciabatta bread</p>
                        </div> -->

                      </div>
    
                      <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab" tabindex="0">
                        <!-- <div class="instruction d-flex align-items-center">
                            <p class="instruction-number ">1</p>
                            <p class="color-heavy-gray">Cook linguine according to package directions. Reserve 1 cup pasta water.</p>
                        </div> -->
                      </div>
    
    
                      <div class="tab-pane fade d-flex justify-content-around" id="pills-contact" role="tabpanel" aria-labelledby="pills-contact-tab" tabindex="0">
                        <div class="container-fluid">
                            <div class="row">
                                <div class="left col-6">
                                    <div class="d-flex justify-content-between align-items-center bg-nutrition p-3 rounded-4 mb-3">
                                        <div class="d-flex align-items-center">
                                            <i class="fa-solid fa-fire heavy-orange-color bg-orange-color p-3 rounded-3 fs-4"></i>
                                            <p class="fs-5 color-heavy-gray ms-2 pt-3">Calories</p>
                                        </div>
                                        <p id="calories" class="fw-bold fs-4" ></p>
                                    </div>
            
                                    <div class="d-flex justify-content-between align-items-center bg-nutrition p-3 rounded-4 mb-3">
                                        <div class="d-flex align-items-center">
                                            <i class="fa-solid fa-wheat-awn p-3 rounded-3 fs-4"></i>
                                            <p class="fs-5 color-heavy-gray ms-2 pt-3">Carbohydrates</p>
                                        </div>
                                        <p id="carbohydrates" class="fw-bold fs-4" ></p>
                                    </div>
            
                                    <div class="d-flex justify-content-between align-items-center bg-nutrition p-3 rounded-4 mb-3">
                                        <div class="d-flex align-items-center">
                                            <i class="fa-brands fa-pagelines p-3 rounded-3 fs-4"></i>
                                            <p class="fs-5 color-heavy-gray ms-2 pt-3">Fiber</p>
                                        </div>
                                        <p id="fiber" class="fw-bold fs-4" ></p>
                                    </div>
                                </div>
            
                                <div class="right col-6">
                                    <div class="d-flex justify-content-between align-items-center bg-nutrition p-3 rounded-4 mb-3">
                                        <div class="d-flex align-items-center">
                                            <i class="fa-solid fa-dumbbell bg-orange-color p-3 rounded-3 fs-4"></i>
                                            <p class="fs-5 color-heavy-gray ms-2 pt-3">Protein</p>
                                        </div>
                                        <p id="protein" class="fw-bold fs-4" ></p>
                                    </div>
            
                                    <div class="d-flex justify-content-between align-items-center bg-nutrition p-3 rounded-4 mb-3">
                                        <div class="d-flex align-items-center">
                                            <i class="fa-solid fa-droplet p-3 rounded-3 fs-4"></i>
                                            <p class="fs-5 color-heavy-gray ms-2 pt-3">Fat</p>
                                        </div>
                                        <p id="fat" class="fw-bold fs-4" ></p>
                                    </div>
            
                                    <div class="d-flex justify-content-between align-items-center bg-nutrition p-3 rounded-4 mb-3">
                                        <div class="d-flex align-items-center">
                                            <i class="fa-solid fa-cube p-3 rounded-3 fs-4"></i>
                                            <p class="fs-5 color-heavy-gray ms-2 pt-3">Sodium</p>
                                        </div>
                                        <p id="sodium" class="fw-bold fs-4" ></p>
                                    </div>
                                </div>
    
                            </div>
                        </div>
                      </div>
    
                      <div class="tab-pane fade" id="pills-chef" role="tabpanel" aria-labelledby="pills-chef-tab" tabindex="0">
                        <div id="chef-tip" class="chef-tips rounded-3 p-2 d-flex align-items-center justify-content-start mb-4">
                            <!-- <i class="fa-solid fa-circle-check me-2"></i>
                            <p class="pt-2"> Don't overcook shrimp - they cook very quickly</p> -->
                        </div>
                      </div>
                    </div>
                </div>
                <button onclick="randomeMeal()" class="p-3 rounded-3 border-0 text-light btn-bg-color fw-bold mt-4"><i class="fa-solid fa-arrows-rotate"></i> Try Another Recipe</button>
            </div>
        </div>
    </section>

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/index.js"></script>
</body>
</html>
